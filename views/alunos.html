<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão | Vortex</title>
<link rel="stylesheet" href="assets/_common/styles/variables.css"><link rel="stylesheet" href="assets/_common/styles/global.css"><link rel="stylesheet" href="assets/_common/styles/components.css"><link rel="stylesheet" href="assets/public/styles/alunos.css">
<style>.entity-tabs{display:flex;gap:.6rem;margin:0 0 1rem}.entity-tabs button{background:transparent;color:inherit;border:1px solid #64748b;padding:.65rem 1rem;border-radius:.5rem;cursor:pointer}.entity-tabs button.is-active{background:#0e7490;border-color:#0e7490;color:#fff}.toast-poo{position:fixed;right:1rem;top:1rem;z-index:1200;max-width:min(28rem,calc(100vw - 2rem));box-shadow:0 8px 24px #0004}.modal-acoes{display:flex;gap:.6rem;margin-top:1rem}</style>
</head>
<body class="alunos-page"><main class="container-alunos" id="alunos-container">
<header class="header-alunos"><h1>Gerenciamento de <span id="titulo-entidade">Alunos</span></h1><button id="btn-novo-aluno" class="btn btn-success" type="button">+ Novo Aluno</button></header>
<nav class="entity-tabs" aria-label="Entidades"><button type="button" data-entity="alunos" class="is-active">Alunos</button><button type="button" data-entity="treinos">Treinos</button><button type="button" data-entity="exercicios">Exercícios</button></nav>
<div class="table-responsive"><table class="table"><thead id="tabela-head"></thead><tbody id="tbody-alunos"><tr><td class="text-center">Carregando…</td></tr></tbody></table></div>
</main>
<div id="modal-aluno" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo"><section class="modal-content"><button class="close" type="button" aria-label="Fechar">&times;</button><h2 id="modal-titulo">Novo registro</h2><input type="hidden" id="aluno-id"><form id="form-aluno" class="mt-4"></form><div class="modal-acoes" id="modal-acoes"><button type="button" id="btn-salvar-aluno" class="btn btn-primary">Salvar</button><button type="button" id="btn-cancelar-aluno" class="btn btn-secondary">Cancelar</button></div></section></div>
<script type="module" src="assets/app/scripts/gestao-poo.js"></script>
</body></html>
