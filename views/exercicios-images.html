<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galeria de exercícios | VORTEX</title>
  <link rel="stylesheet" href="assets/_common/styles/variables.css"><link rel="stylesheet" href="assets/_common/styles/global.css"><link rel="stylesheet" href="assets/_common/styles/components.css">
</head>
<body class="app-body">
  <main class="app-main" style="max-width:1100px;margin:auto;padding:2rem">
    <h1>Galeria de imagens de exercícios</h1>
    <p>JPEG, PNG ou WebP; até 5 MB por imagem. Até 10 imagens por envio. É necessário entrar como administrador.</p>
    <form id="gallery-form">
      <label for="exercicio-id">ID do exercício</label>
      <input id="exercicio-id" type="number" min="1" required>
      <button type="submit">Carregar galeria</button>
      <div style="margin-top:1rem">
        <label for="gallery-files">Adicionar imagens</label>
        <input id="gallery-files" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <label for="gallery-alt">Texto alternativo (opcional)</label>
        <input id="gallery-alt" type="text" maxlength="255">
        <button id="upload-images" type="button">Enviar selecionadas</button>
      </div>
    </form>
    <p id="gallery-status" role="status" aria-live="polite"></p>
    <div id="gallery-preview" style="display:flex;gap:12px;flex-wrap:wrap"></div>
    <section id="gallery-list" aria-label="Imagens já salvas" style="display:flex;gap:16px;flex-wrap:wrap;margin-top:1rem"></section>
  </main>
  <script src="js/auth-manager.js"></script><script>if (!authManager.redirectIfNotAuth('admin')) location.href='auth.html';</script>
  <script type="module" src="assets/app/scripts/exercicio-gallery.js"></script>
</body>
</html>
