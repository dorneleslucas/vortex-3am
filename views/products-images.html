<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria de produtos | VORTEX</title>
  <link rel="stylesheet" href="assets/_common/styles/variables.css">
  <link rel="stylesheet" href="assets/_common/styles/global.css">
  <link rel="stylesheet" href="assets/_common/styles/components.css">
  <style>
    .gallery-main{max-width:1100px;margin:auto;padding:2rem}
    .gallery-form{display:grid;gap:.75rem;max-width:36rem}
    .gallery-preview,.gallery-list{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}
    .gallery-card{border:1px solid #94a3b8;padding:12px;border-radius:8px}
    .gallery-image{width:180px;height:140px;object-fit:cover}
    .gallery-status{min-height:1.5em}
  </style>
</head>
<body class="app-body">
  <main class="gallery-main">
    <p><a href="admin.html">Voltar ao painel</a></p>
    <h1>Galeria de imagens de produtos</h1>
    <p>JPEG, PNG ou WebP; até 5 MB por imagem. Envie até 10 imagens por vez. É necessário entrar como administrador.</p>
    <form id="gallery-form" class="gallery-form">
      <label for="product-id">ID do produto</label>
      <input id="product-id" type="number" min="1" required>
      <button id="load-gallery" type="submit">Carregar galeria</button>
      <label for="gallery-files">Adicionar imagens</label>
      <input id="gallery-files" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <label for="gallery-alt">Texto alternativo (opcional, até 255 caracteres)</label>
      <input id="gallery-alt" type="text" maxlength="255">
      <button id="upload-images" type="button">Enviar selecionadas</button>
    </form>
    <p id="gallery-status" class="gallery-status" role="status" aria-live="polite"></p>
    <div id="gallery-preview" class="gallery-preview" aria-label="Prévias das imagens selecionadas"></div>
    <section id="gallery-list" class="gallery-list" aria-label="Imagens salvas do produto"></section>
  </main>
  <script src="js/auth-manager.js"></script>
  <script>if (!authManager.redirectIfNotAuth('admin')) location.href='auth.html';</script>
  <script type="module" src="assets/app/scripts/product-gallery.js"></script>
</body>
</html>
